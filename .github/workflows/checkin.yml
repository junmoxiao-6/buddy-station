name: Daily check-in

# 定时签到 + 猫猫旅行闭环。
#
# 前置条件（只用做一次）：
#   1. 本地执行 `buddy-station acquire-rt --show` 拿到 refresh token
#   2. 仓库 Settings → Secrets and variables → Actions 新建 secret: WORKBUDDY_RT
#
# 说明：
#   * cron 是 **UTC**。30 1 * * * UTC = 北京时间 09:30（Asia/Shanghai, UTC+8），每天一次。
#     GitHub 的定时任务本身有几分钟到几十分钟的排队延迟，不必卡整点。
#   * refresh token 会轮换；CI 的 secret 无法自动回写，失效后重新导出一次即可。
#   * 签到是幂等的，多跑不会重复加分。
#   * 失败重试：失败后 30 分钟重试一次，最多 2 次（共 3 次尝试）；
#     若命中鉴权类错误（401 / 12153 / Session not active）立即停止，不空转。

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "凭据通道（rt 用 secret，token_file 需要自备令牌文件）"
        required: false
        default: "rt"

permissions:
  contents: read

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 3 次尝试之间各有 30 分钟等待，上限放宽到 90 分钟
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Preflight (read-only)
        env:
          WORKBUDDY_RT: ${{ secrets.WORKBUDDY_RT }}
        run: |
          python -m buddy_station diagnose || true

      - name: Run
        id: run
        env:
          WORKBUDDY_RT: ${{ secrets.WORKBUDDY_RT }}
          CHANNEL: ${{ github.event.inputs.channel || 'rt' }}
        run: |
          set +e
          attempt=0
          max_retry=2
          code=1
          while :; do
            python -m buddy_station run --channel "$CHANNEL" --allow-unverified-uid 2>&1 | tee result.json
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              break
            fi
            if grep -qE '"code"[[:space:]]*:[[:space:]]*12153|401|Session not active' result.json; then
              echo "auth error detected, skip retry"
              break
            fi
            if [ "$attempt" -ge "$max_retry" ]; then
              echo "reached max retry ($max_retry)"
              break
            fi
            attempt=$((attempt+1))
            echo "::warning::run failed (exit $code), retry $attempt/$max_retry in 30min"
            sleep 1800
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
          echo "### 签到结果（exit $code，重试 $attempt 次）" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-result-${{ github.run_number }}
          path: result.json
          retention-days: 14
          if-no-files-found: ignore

      # 失败时把原因写进汇总，避免只有红叉没有信息
      - name: Explain failure
        if: failure()
        run: |
          echo "### 失败" >> "$GITHUB_STEP_SUMMARY"
          echo "退出码 10 = 需要人工（鉴权失效 / 账号不符）" >> "$GITHUB_STEP_SUMMARY"
          echo "退出码 20 = 没有可用通道（检查 WORKBUDDY_RT 是否已设置/是否过期）" >> "$GITHUB_STEP_SUMMARY"
          echo "退出码 30 = 上游异常（已自动重试，仍失败则需人工）" >> "$GITHUB_STEP_SUMMARY"
