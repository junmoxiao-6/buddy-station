name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import sys; sys.path.insert(0,'src'); import buddy_station; print(buddy_station.__version__)")
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver" || { echo "::error::tag 与 __version__ 不一致"; exit 1; }

      - name: Unit tests
        env:
          BUDDY_STATION_HOME: ${{ runner.temp }}/buddy-station
        run: python -m unittest discover -s tests

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            安装：

            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/buddy_station-${{ github.ref_name }}.whl
            ```

            或从源码：

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd buddy-station && pip install -e .
            ```

            完整说明见 [README](https://github.com/${{ github.repository }}#readme)。
