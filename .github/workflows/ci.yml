name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable)
        run: python -m pip install -e .

      - name: Smoke test (no network)
        run: python -m buddy_station --selftest

      - name: CLI help
        run: python -m buddy_station --help

      - name: Version matches package metadata
        run: python -c "import buddy_station, importlib.metadata as m; print(buddy_station.__version__); assert buddy_station.__version__ == m.version('buddy-station')"

      - name: Unit tests
        env:
          # 测试数据必须落在临时目录，绝不写到用户真实数据目录
          BUDDY_STATION_HOME: ${{ runner.temp }}/buddy-station
        run: python -m unittest discover -s tests -v

  lint:
    name: lint (errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      # 只拦真正的错误（未定义名、语法、import 失败），不卡代码风格：
      # 风格问题交给本地 ruff format，避免 CI 因空格红叉
      - name: Ruff check (E9/F63/F7/F82)
        run: ruff check --select E9,F63,F7,F82 --output-format=concise src tests

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
